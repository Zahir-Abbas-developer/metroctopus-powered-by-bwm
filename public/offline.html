<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Agency OS</title>
    <style>
      :root {
        --ink: #0c0c0a;
        --paper: #fafaf7;
        --cream: #f5f2eb;
        --brand: #1a6b3a;
        --line: #e2e0d8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        max-width: 420px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        padding: 40px 32px;
        text-align: center;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 24px;
        border-radius: 12px;
        background: var(--brand);
        color: var(--paper);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(12, 12, 10, 0.4);
        margin: 0 0 10px;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: rgba(12, 12, 10, 0.6);
        margin: 0 0 24px;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 11px 22px;
        cursor: pointer;
      }
      button:hover { background: #000; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">A</div>
      <p class="eyebrow">No connection</p>
      <h1>You&rsquo;re offline</h1>
      <p>
        Agency OS shows live data &mdash; scores, deadlines and who is working
        right now &mdash; so it waits for a connection rather than showing you
        something out of date.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
